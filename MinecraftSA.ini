; MinecraftSA.ini - place next to MinecraftSA.asi in the GTA San Andreas folder.
; Key values are Windows virtual-key codes in decimal (G = 71, Shift = 16, LMB = 1, RMB = 2).

[Skin]
Enabled=1
; steve.dff + steve.txd must be inside models\gta3.img. The model has to be skinned to the
; GTA ped skeleton (Bip01 hierarchy) so the stock animations drive it.
ModelName=steve
; Special-character slot 1..10  ->  model ids 290..299
Slot=1

[Keys]
Glide=71
; Double-tap this while airborne to start gliding. SA's default jump key is Left Shift (16).
Jump=16
Attack=1
Rocket=2

[Combat]
; Minecraft health is 20 HP, GTA is 100 HP, so everything is scaled by this factor.
HpScale=5.0
SwordDamage=6.0
SwordReach=3.0
SwordArcDegrees=60
; Iron sword attack speed 1.6 -> full recharge in 625 ms
SwordAttackSpeed=1.6
SwordKnockback=0.4
SweepRadius=1.0
SweepDamage=1.0

[Elytra]
MinStartAltitude=2.0
; Slows the final descent so GTA's fall damage does not trigger on touchdown.
SafeLanding=1
FlareHeight=3.0
; Added to vertical speed to cancel the gravity step the game applies to airborne peds.
GravityCompensation=1.0
RocketFlightDuration=1

[Animations]
GlideName=FALL_SkyDive
GlideBlock=PARACHUTE
SwingBlock=SWORD
Swing1=sword_1
Swing2=sword_2
Swing3=sword_3
