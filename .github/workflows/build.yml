name: Build MinecraftSA.asi

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract plugin-sdk.zip
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath plugin-sdk.zip)) {
            throw "plugin-sdk.zip is not in the repository root"
          }
          Expand-Archive -LiteralPath plugin-sdk.zip -DestinationPath plugin-sdk-extracted -Force

          # The zip may or may not wrap everything in a top-level folder: find 'plugin_sa' and use its parent.
          $marker = Get-ChildItem -Path plugin-sdk-extracted -Directory -Recurse -Filter plugin_sa |
                    Sort-Object { $_.FullName.Length } |
                    Select-Object -First 1
          if (-not $marker) {
            Get-ChildItem -Path plugin-sdk-extracted | Select-Object -First 30 | ForEach-Object { Write-Host $_.FullName }
            throw "No 'plugin_sa' folder inside plugin-sdk.zip - is it the plugin-sdk repository?"
          }
          $sdk = $marker.Parent.FullName
          Write-Host "plugin-sdk root: $sdk"
          "PLUGIN_SDK_DIR=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Show toolchain (C++23 needs Visual Studio 2022 17.3 or newer)
        shell: pwsh
        run: |
          cmake --version
          $vswhere = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path -LiteralPath $vswhere) {
            Write-Host ("Visual Studio: " + (& $vswhere -latest -products * -property catalog_productDisplayVersion))
          }

      - name: Configure (Win32, C++23)
        shell: pwsh
        run: |
          cmake -S . -B build -A Win32 "-DPLUGIN_SDK_DIR=$env:PLUGIN_SDK_DIR" *>&1 | Tee-Object -FilePath configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build (Release)
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel *>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            configure.log
            build.log
          if-no-files-found: ignore

      - name: Check the .asi is a 32-bit DLL
        shell: pwsh
        run: |
          $asi = "build/dist/Release/MinecraftSA.asi"
          if (-not (Test-Path -LiteralPath $asi)) { throw "$asi was not produced" }
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $asi))
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $pe + 4)
          if ($machine -ne 0x14C) { throw ("Not a 32-bit (x86) binary, machine = 0x{0:X}" -f $machine) }
          Write-Host ("OK: x86 binary, {0} bytes" -f $bytes.Length)

      - name: Collect output
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item build/dist/Release/MinecraftSA.asi dist/
          Get-ChildItem -Path . -Filter *.ini -File | Copy-Item -Destination dist/

      - name: Upload MinecraftSA
        uses: actions/upload-artifact@v4
        with:
          name: MinecraftSA
          path: dist/*
          if-no-files-found: error
